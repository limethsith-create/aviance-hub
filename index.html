/* ===================== AVIANCE OS — shell styles =====================
   Layout and behaviour of the shell; the look (tokens, radii, type) is in theme.css, polish.css and brand.css.
   Sentence case. One brand colour for the primary action and "needs you"; pills: green = good, amber = waiting, red = needs you, grey = done.
   The places are a sidebar on a computer and a tab bar along the bottom on a phone.
   Each screen's own stylesheet is loaded above; these rules sit on top of them. */
/* All colours, radii, shadows and type sizes (--bg, --surface, --border, --brand, --fs-*, …) live in theme.css. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:var(--fs-base);line-height:1.5;background:var(--bg)!important;color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
::placeholder{color:var(--muted-2);opacity:1}
::selection{background:var(--text);color:var(--bg)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d4d8e0;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#c2c7d2;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
input,textarea,select,button{font-family:inherit}
b,strong,th,h5,summary{font-weight:600}
a{color:var(--text);text-underline-offset:2px}
h1,h2,h3,h4{font-weight:600}

.app{display:grid;grid-template-columns:244px 1fr;height:100vh;height:100dvh}

/* For a screen reader only: a name or a change a sighted person reads from the layout. */
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
/* The first stop of every Tab: jump the eleven places and land on the screen. */
.skip-link{position:absolute;top:0;left:0;z-index:400;transform:translateY(-120%);background:var(--surface);color:var(--text);border:2px solid var(--text);padding:10px 16px;font-size:var(--fs-base);font-weight:600;text-decoration:none}
.skip-link:focus{transform:translateY(0)}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;padding:16px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:8px 8px 16px}
.logo{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--border);overflow:hidden;color:transparent!important;background-color:#fff!important;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIiB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCI+PGRlZnM+PC9kZWZzPjxwb2x5Z29uIHBvaW50cz0iMjgsODggMTAwLDEyOCAxNzIsODggMTcyLDE1MCAxMDAsMTkwIDI4LDE1MCIgZmlsbD0iIzEwMTAxNSIgLz48cG9seWdvbiBwb2ludHM9IjI4LDg4IDEwMCwxMjggMTAwLDE5MCAyOCwxNTAiIGZpbGw9IiMxQzFDMjIiIC8+PHBvbHlnb24gcG9pbnRzPSIxMDAsMTI4IDE3Miw4OCAxNzIsMTUwIDEwMCwxOTAiIGZpbGw9IiMwQTBBMEMiIC8+PHBvbHlnb24gcG9pbnRzPSIzMCw3MiAxMDAsMTEwIDE3MCw3MiAxMDAsMzQiIGZpbGw9IiNFMDI5MEYiIC8+PGcgdHJhbnNmb3JtPSJtYXRyaXgoMC4zNSwtMC4xOSwwLjM1LDAuMTksMzAsNzIpIj48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSg0LDQpIHNjYWxlKDAuOTIpIj48cGF0aCBmaWxsLXJ1bGU9ImV2ZW5vZGQiIGQ9Ik0xMDAgMTggTDE1NiAxNzIgTDEyOCAxNzIgTDExNyAxNDAgTDgzIDE0MCBMNzIgMTcyIEw0NCAxNzIgWiBNOTEgMTE0IEwxMDkgMTE0IEwxMDAgODQgWiIgZmlsbD0iI0ZGRkZGRiIvPjwvZz48L2c+PC9zdmc+")!important;background-size:76%!important;background-position:center!important;background-repeat:no-repeat!important}
.brand h1{font-size:var(--fs-h3);font-weight:600;line-height:1.2}
.brand span{font-size:var(--fs-min);color:var(--muted);font-weight:400}
.nav-area{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;padding-top:8px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;cursor:pointer;color:var(--muted);background:none;border:none;font:inherit;font-size:var(--fs-base);font-weight:400;text-align:left;transition:background .13s,color .13s;position:relative;user-select:none}
.nav-item svg{width:20px;height:20px;flex:none;stroke-width:2}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.nav-item.active{background:var(--surface-2);color:var(--text);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--text)}
/* badges: red = that many need you, amber = that many are waiting for your yes */
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;font-size:var(--fs-min);font-weight:600;line-height:1}
.badge.red{background:var(--red);color:#fff}
.badge.amber{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.nav-item .badge{margin-left:auto}
.nav-item .ext{margin-left:auto;color:var(--muted-2);font-size:var(--fs-min)}
/* the phone's tab bar (hidden on a computer): four places and "More" */
.tabbar{display:none}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;min-width:0;padding:6px 2px;background:none;border:none;color:var(--muted);font:inherit;font-size:var(--fs-min);cursor:pointer;position:relative}
.tab .tab-ic{position:relative;display:grid;place-items:center;width:28px;height:26px}
.tab svg{width:24px;height:24px;stroke-width:2}
.tab .badge{position:absolute;top:-6px;left:17px;min-width:22px;height:22px;padding:0 6px}
.tab.active{color:var(--text);font-weight:600}
.tab.active::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--text)}
.tab:focus-visible{outline:2px solid var(--text);outline-offset:-3px}
.sidebar-foot{border-top:1px solid var(--border-soft);padding-top:10px;margin-top:6px}
.who{display:flex;align-items:center;gap:10px;padding:8px}
.who .meta{flex:1;line-height:1.3;overflow:hidden}
.who .meta b{font-size:var(--fs-base);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .meta small{font-size:var(--fs-min);color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{flex:none;display:grid;place-items:center;font-weight:600;color:#fff;font-size:var(--fs-small)}
/* sign out, beside your name */
.who-out{flex:none;width:36px;height:36px;display:grid;place-items:center;background:none;border:none;color:var(--sidebar-dim,var(--muted));cursor:pointer}
.who-out svg{width:18px;height:18px;stroke-width:2}
.who-out:hover{background:var(--sidebar-hover,var(--surface-2));color:var(--sidebar-active,var(--text))}
.who-out:focus-visible{outline:2px solid var(--sidebar-active,var(--text));outline-offset:-2px}
/* the phone's "More" sheet: the places that do not fit in the tab bar, then find, light or dark, sign out */
.more-list{display:flex;flex-direction:column;padding-top:4px;padding-bottom:8px}
.more-item{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 2px;background:none;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);font:inherit;font-size:var(--fs-base);text-align:left;cursor:pointer}
.more-item:last-child{border-bottom:none}
.more-item svg{width:20px;height:20px;flex:none;stroke-width:2;color:var(--muted)}
.more-item .badge{margin-left:auto}
.more-item.active{font-weight:600}
.more-item.active svg{color:var(--brand)}
.more-item:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.more-rule{height:1px;background:var(--border);margin:6px 0}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{position:relative;display:flex;align-items:center;gap:14px;padding:12px 32px;min-height:68px;border-bottom:1px solid var(--border-soft);background:var(--surface)}
.back-btn{display:none;width:44px;height:44px;margin-left:-8px;border:none;background:none;place-items:center;cursor:pointer;color:var(--text);flex:none}
.back-btn svg{width:24px;height:24px;stroke-width:2.2}
.back-btn:hover{background:var(--surface-2)}
.back-btn:focus-visible{outline:2px solid var(--text)}
.page-title{min-width:0;flex:1}
.page-title h2{font-size:var(--fs-h2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-title p{font-size:var(--fs-small);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);padding:8px 12px;width:240px;color:var(--muted);font-size:var(--fs-min);cursor:pointer;font-family:inherit;text-align:left}
.search input,.search .search-ph{background:none;border:none;outline:none;color:var(--muted-2);font-size:var(--fs-min);width:100%;cursor:pointer;text-align:left}
.search svg{width:16px;height:16px;flex:none}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;background:var(--surface-2);border:1px solid var(--border);font-size:var(--fs-min);color:var(--muted);font-weight:600}
.tb-btn{width:44px;height:44px;border:1px solid var(--border-soft);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none;position:relative;transition:.13s}
.tb-btn:hover{color:var(--text);background:var(--surface-2)}
.tb-btn svg{width:18px;height:18px}
.tb-dot{position:absolute;top:3px;right:3px;min-width:20px;height:20px;padding:0 4px;background:var(--red);color:#fff;font-size:var(--fs-min);font-weight:600;display:grid;place-items:center;line-height:1}
/* DESIGN.md: every money figure, count, reference and date-stamp is MONO. The
   screens whose own stylesheet already carries a figure recipe (prospects.css's
   .pr-fig, brand.css's tile numbers) are covered; this is the shell's one for
   the screens that have none. Put it on the leaf that holds the figure, never
   on a heading — brand.css sets the display face on h1-h4 and would win. */
.fig{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:44px;cursor:pointer;white-space:nowrap;font-size:var(--fs-base);font-weight:600;background:var(--text);color:var(--bg);border:1px solid var(--text);padding:10px 16px;transition:background .12s linear,color .12s linear}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn:hover{background:var(--bg);color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--text)}
.btn.ghost:hover{background:var(--text);color:var(--bg)}
.btn svg{width:16px;height:16px;stroke-width:2.4}
.btn:disabled{opacity:.5;cursor:default}
.content{flex:1;overflow-y:auto;padding:28px 32px 40px;-webkit-overflow-scrolling:touch}
.content>.view{max-width:960px;margin:0 auto}
.view{animation:viewIn .34s cubic-bezier(.2,.7,.25,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* SHARED */
.section-head{display:flex;align-items:center;gap:11px;margin:28px 0 15px;flex-wrap:wrap}
.section-head:first-child{margin-top:0}
.section-head h3{font-size:var(--fs-h3);font-weight:600}
.section-head .count{font-size:var(--fs-min);font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:2px 9px}

.card{background:var(--surface);border:1px solid var(--border-soft);transition:border-color .16s ease}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-min);font-weight:600;padding:4px 9px;line-height:1.3;white-space:nowrap}

.pill.green{background:var(--green-bg);color:var(--green)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.grey{background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}
.flex{display:flex;align-items:center;gap:10px}
.pj-ic{display:grid;place-items:center;font-weight:600;font-size:20px;flex:none}
.empty{text-align:center;padding:58px 26px}
.empty-ic{width:62px;height:62px;border:1px solid var(--border-soft);background:var(--surface);display:grid;place-items:center;margin:0 auto 16px;color:var(--text)}
.empty-ic svg{width:27px;height:27px}
.empty h3{font-size:var(--fs-h2);margin-bottom:7px}
.empty p{font-size:var(--fs-base);color:var(--muted);max-width:390px;margin:0 auto 18px;line-height:1.62}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border-soft);padding:3px}
.seg button{border:none;background:none;color:var(--muted);font-size:var(--fs-small);font-weight:600;min-height:40px;padding:8px 14px;cursor:pointer;transition:.12s;white-space:nowrap}
.seg button:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.field{margin-bottom:14px}
.field label{display:block;font-size:var(--fs-min);font-weight:600;color:var(--text);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--border);padding:10px 12px;color:var(--text);font-size:var(--fs-base);outline:none;transition:.12s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.field textarea{resize:vertical;min-height:68px;line-height:1.55}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.field.row2>div label{display:block;font-size:var(--fs-min);font-weight:600;color:var(--text);margin-bottom:7px}

/* LOGIN */
.login-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
/* What shows while the saved session is checked, so the sign-in form never flashes up for someone already signed in. */
.boot-screen{position:fixed;inset:0;z-index:210;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:var(--fs-small)}
.boot-screen .logo{width:44px;height:44px}
/* One centred card, with the mark big enough to be the first thing you see.
   The old screen was a two-panel pitch: a headline, three bullets and the
   guarantee. That is marketing, and the people who reach this screen have
   already bought or already work here. */
/* What shows while a screen that reads before it draws is still reading. */
.view-loading{padding:16px 20px;color:var(--muted);font-size:var(--fs-small)}

/* MODAL / TOAST */
.modal-wrap{position:fixed;inset:0;z-index:260;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px}
.modal-wrap.open{display:flex;animation:fade .18s ease}
.modal{width:480px;max-width:100%;max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border)}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 15px;border-bottom:1px solid var(--border-soft)}
.modal-head h3{font-size:var(--fs-h3);font-weight:600}
.modal-head p{font-size:var(--fs-small);color:var(--muted);margin-top:3px;line-height:1.45}
.modal-body{padding:20px 22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);z-index:300;background:#000;color:#fff;border:1px solid #000;padding:12px 18px;font-size:var(--fs-small);font-weight:400;opacity:0;visibility:hidden;transition:.28s;display:flex;align-items:center;gap:10px;max-width:90vw}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast .tdot{width:8px;height:8px;background:var(--red-brand);flex:none}

/* COMMAND PALETTE + NOTIFICATIONS */
.cmdk-wrap{position:fixed;inset:0;z-index:300;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(16,20,26,.45);backdrop-filter:blur(2px)}
.cmdk-wrap.open{display:flex;animation:fade .12s ease}
.cmdk{width:600px;max-width:92vw;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--border-soft)}
.cmdk-in svg{width:18px;height:18px;color:var(--muted);flex:none}
.cmdk-in input{flex:1;border:none;outline:none;background:none;font-size:var(--fs-h3);color:var(--text)}
.cmdk-list{max-height:52vh;overflow-y:auto;padding:7px}
.cmdk-group{font-size:var(--fs-min);color:var(--muted-2);font-weight:600;padding:10px 11px 5px}
.cmdk-item{display:flex;align-items:center;gap:12px;padding:9px 11px;cursor:pointer;color:var(--text);width:100%;background:none;border:0;font:inherit;text-align:left}
.cmdk-item .ci-ic{width:30px;height:30px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.cmdk-item .ci-ic svg{width:16px;height:16px}
.cmdk-item b{font-size:var(--fs-base);font-weight:600;display:block;line-height:1.25}
.cmdk-item small{font-size:var(--fs-min);color:var(--muted);display:block;margin-top:2px}
.cmdk-item.sel{background:var(--surface-2)}
.cmdk-empty{padding:26px;text-align:center;color:var(--muted);font-size:var(--fs-base)}
.notif-pop{position:absolute;top:calc(100% - 4px);right:12px;width:380px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);z-index:60;display:none;overflow:hidden}
.notif-pop.open{display:block;animation:fade .14s ease}
.notif-head{padding:13px 15px;border-bottom:1px solid var(--border-soft);font-size:var(--fs-base);font-weight:600}
.notif-list{max-height:60vh;overflow-y:auto}
.notif-item{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:.12s;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:var(--text);text-align:left}
.notif-item:hover{background:var(--surface-2)}
.notif-item:last-child{border-bottom:none}
.notif-item .nd{width:8px;height:8px;flex:none;margin-top:5px}
.notif-item b{font-size:var(--fs-base);font-weight:600;display:block;line-height:1.4}
.notif-item small{font-size:var(--fs-small);color:var(--muted);display:block;margin-top:3px;line-height:1.45}
.notif-empty{padding:30px 15px;text-align:center;color:var(--muted);font-size:var(--fs-base)}

/* RESPONSIVE — phone: one column, the places as a tab bar at the bottom */
@media(max-width:860px){

/* ===================== AVIANCE OS — shell =====================
   Sign-in, the router, the navigation (sidebar on a computer, tab bar on a
   phone), ⌘K, notifications, theme. The shell draws no screen of its own.

   Each screen lives in one file, loaded by a <script> tag at the end of this
   page, and reaches the database through the `sb` client below. The hub calls
   no other server. SCHEMA.md lists every table and which file owns it.

     digest.js      Today, Friday update, month end     meetings.js    every call, and how it went
     drafts.js      replies the bot wrote, to approve   pipeline.js    website bookings and the funnel
     clientbook.js  clients, and what needs you         channels.js    talking with the team and clients

   The email sending itself happens in an outside tool. No keys are kept here. */

/* ---- Icons ---- */

/* ---- Config ---- */
const SUPA_URL='https://zjbxnkpktbghhudjbxhk.supabase.co';
const SUPA_KEY='sb_publishable_WV4FANV2hNsmbzK3DbiLFg_9bjiB8Z1';
/* The hub stands on its own. Everything it knows is in its own database, reached through sb below.
   It calls no other server. */
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

/* ---- State ---- */
let authUser=null, currentView='home';

/* ---- Helpers ---- */
/* The one escape and the one onclick-argument, from core.js (loaded first). Every
   file below calls esc(); it is the strict five-character escape, nothing weaker. */
var esc = coreEsc;
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
function errEl(id,msg){const e=document.getElementById(id);if(e)e.textContent=msg;return false}
/* `action` is a snippet of JavaScript, written here or by a screen file — never a
   client's name. It is still escaped on the way into the attribute: the browser
   decodes it before it runs, so a literal like render('clients') works exactly as
   before, and the day somebody passes a company name through this it cannot close
   the attribute and start a new one.
   `icon` is an inline SVG from I, and `title`, `sub` and `btn` arrive escaped
   already (see cbEmpty in clientbook.js), so escaping those here would show a
   person '&amp;amp;' where they meant '&'. */
function emptyState(icon,title,sub,btn,action){return `<div class="card"><div class="empty"><div class="empty-ic">${icon}</div><h3>${title}</h3><p>${sub}</p>${btn?`<button class="btn" onclick="${esc(action)}">${btn}</button>`:''}</div></div>`}
function toast(msg){const t=document.getElementById('toast');t.innerHTML=`<span class="tdot" aria-hidden="true"></span><span>${esc(msg)}</span>`;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),4000);}
/* Say something that changed on its own — a count, a saved note — so a screen reader
   hears it instead of it appearing silently. Nothing is drawn: the region is off-screen. */
function announce(msg){const el=document.getElementById('liveSay');if(!el)return;el.textContent='';setTimeout(()=>{el.textContent=String(msg==null?'':msg);},40);}
/* Set or clear an attribute on something that may not be a real element (a test stub). */
function attr(el,k,v){if(!el||typeof el.setAttribute!=='function')return;
  if(v==null){if(typeof el.removeAttribute==='function')el.removeAttribute(k);}else el.setAttribute(k,String(v));}
/* Who had the keyboard before a panel opened, so Escape can hand it back. */
let lastFocus=null;
function keepFocus(){const a=document.activeElement;lastFocus=a&&a!==document.body?a:null;}
function giveFocusBack(){const a=lastFocus;lastFocus=null;
  if(a&&typeof a.focus==='function'&&(typeof document.contains!=='function'||document.contains(a))){try{a.focus();}catch(e){}}}
/* Every control inside `box` that the keyboard can reach, in order. */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function focusables(box){
  if(!box||typeof box.querySelectorAll!=='function')return [];
  return [...box.querySelectorAll(FOCUSABLE)].filter(e=>{
    if(typeof e.getBoundingClientRect!=='function')return true;
    const r=e.getBoundingClientRect();return r.width>0||r.height>0;});}
/* Keep Tab inside an open panel: a dialog the keyboard can walk out of is not a dialog. */
function trapTab(box,e){
  if(e.key!=='Tab')return false;
  const f=focusables(box);
  if(!f.length){e.preventDefault();if(box&&box.focus)box.focus();return true;}
  const first=f[0],last=f[f.length-1];
  if(!box.contains(document.activeElement)){e.preventDefault();first.focus();return true;}
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();return true;}
  if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();return true;}
  return false;
}
/* The skip link: land the keyboard on the screen itself, past the eleven places. */
function skipToContent(e){if(e&&e.preventDefault)e.preventDefault();const c=document.getElementById('content');if(!c)return;const f=focusables(c)[0];if(f)f.focus();else c.focus();}
function closeNotif(){const p=document.getElementById('notifPop');if(p&&p.classList.contains('open')){p.classList.remove('open');
  attr(document.getElementById('notifBtn'),'aria-expanded','false');
  if(typeof p.contains!=='function'||p.contains(document.activeElement)||document.activeElement===document.body)giveFocusBack();else lastFocus=null;
  return true;}return false;}
function openModal(html){
  closeNotif();keepFocus();
  const m=document.getElementById('modal');
  m.innerHTML=html;
  attr(m,'role','dialog');attr(m,'aria-modal','true');attr(m,'tabindex','-1');
  const h=typeof m.querySelector==='function'?m.querySelector('.modal-head h3'):null;
  if(h){if(!h.id)h.id='modalTitle';attr(m,'aria-labelledby',h.id);}else attr(m,'aria-labelledby',null);
  document.getElementById('modalWrap').classList.add('open');
  /* the first field or button, so the keyboard is already inside it */
  setTimeout(()=>{if(!document.getElementById('modalWrap').classList.contains('open'))return;
    if(typeof m.contains==='function'&&m.contains(document.activeElement))return;
    const f=focusables(m)[0];const t=f||m;if(t&&typeof t.focus==='function')t.focus();},0);
}
function closeModal(){const w=document.getElementById('modalWrap');if(!w.classList.contains('open'))return;w.classList.remove('open');giveFocusBack();}
document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal();});

/* ---- Router. Every entry names a function in one of the files above, which
   load after this script, so each is called through V() rather than directly.
   The places in the sidebar are set by navItems(); anything else is a page
   inside one of them and carries a Back button (back). owner: only the owner
   is offered it. ---- */
const views={
  /* Today leads with the commitment board (guarantee.js): what the whole book
     owes this month and what it costs if nothing changes. It is first because
     it is the only screen that looks across every client at once, and the
     thing it warns about cannot be fixed after the month ends. Both halves

/* Every screen goes through here, so a screen whose file has not loaded yet says so
   instead of throwing. Each area is one file; see SCHEMA.md. */
function viewError(e){return '<div class="card"><div class="empty"><h3>Something went wrong</h3><p>'+esc((e&&e.message)||'This screen could not be drawn.')+'</p></div></div>'}
function V(name,arg){
  const f=typeof window!=='undefined'?window[name]:null;
  if(typeof f!=='function')return '<div class="card"><div class="empty"><h3>Not loaded</h3><p>This screen\u2019s file did not load. Reload the page, and if it keeps happening tell whoever looks after Aviance OS.</p></div></div>';
  try{return f(arg)}catch(e){return viewError(e)}
}

/* A seat that is one screen wide. Somebody the owner has appointed to one client's
   prospects (a row in `prospect_grants`) is not approved team: they hold no role, see
   no money, no invoice, no agreement, no setting and no other client, and the database
   gives them nothing anywhere else. In here they get the prospect window and nothing
   beside it. The grant is the seat; RLS, not this list, is what keeps them out. */
const PROSPECT_SEAT_VIEWS=['prospects','prospect'];
function hubProspectSeat(){return !!(authUser&&authUser.role==='prospect');}
function hubAllowed(v){
  if(hubProspectSeat())return PROSPECT_SEAT_VIEWS.includes(v);
  return !(views[v]&&views[v].owner)||!authUser||authUser.role==='admin';
}
/* Kept for the screens that ask. The shell itself never holds a client: routeUser sends one to portal.html. */
function hubIsClient(){return !!(authUser&&authUser.role==='client');}
/* What each screen's file wants to hear after any screen is drawn (its timers, its badge). */
const RENDER_HOOKS=['mtOnRender','channelsOnRender','empOnRender'];
function render(v){
  if(!views[v]||!authUser)return;
  if(!hubAllowed(v))v=hubProspectSeat()?'prospects':'home';
  const view=views[v];if(!view)return;
  const box=document.getElementById('content');
  /* A screen that draws ITSELF again after a button (a stage move, an invoice
     marked paid) throws away the button that had the keyboard's focus, and the
     browser drops focus to the top of the document: the next Tab starts from the
     sidebar again. Keep it in the screen. Only for a redraw of the same screen —
     arriving from the sidebar leaves focus on the sidebar, where the person is. */
  const held=currentView===v&&typeof box.contains==='function'&&box.contains(document.activeElement);
  currentView=v;
  const paint=html=>{box.innerHTML=`<div class="view${view.wide?' wide':''}">${html}</div>`;
    if(held&&!box.contains(document.activeElement)&&typeof box.focus==='function'){try{box.focus({preventScroll:true});}catch(e){}}};
  const out=view.fn();
  if(out&&typeof out.then==='function'){   // a screen that reads before it draws: say so, then fill it in if they are still on it
    paint('<div class="card view-loading" role="status">Loading\u2026</div>');
    out.then(html=>{if(currentView===v)paint(html);},e=>{if(currentView===v)paint(viewError(e));});
  }else paint(out);
  document.getElementById('ptitle').textContent=view.title;
  document.getElementById('psub').textContent=view.sub;
  const back=document.getElementById('backBtn');if(back)back.style.display=view.back?'grid':'none';
  renderNav();box.scrollTop=0;
  try{updateNotifBadge();}catch(e){}
  RENDER_HOOKS.forEach(h=>{try{if(typeof window[h]==='function')window[h](v);}catch(e){}});
}

/* ---- Deep links: #clients (and the old #trials, #paying), #calendar, #calendar/{meetingId}, #inquiry/{bookingId},
   #channels, #channels/{id}, #drafts, #employees, #documents, #onboarding, #settings.
   Honoured on load and on hashchange; when signed out, kept until sign-in. A link to a screen that is gone opens Today. ---- */
function parseDeepLink(h){
  h=String(h||'');const at=h.indexOf('#');if(at<0)return null;h=h.slice(at+1).replace(/^\/+/,'').replace(/\/+$/,'');
  if(h==='trials'||h==='clients'||h==='paying')return {view:'clients'};
  if(h==='onboarding'||h==='journey')return {view:'journey'};
  if(h==='alerts'||h==='settings'||/^settings\//.test(h))return {view:'settings'};
  if(h==='inquiries')return {view:'calendar'};
  if(['calendar','channels','drafts','employees','documents','prospects'].includes(h))return {view:h};
  const m=h.match(/^(inquiry|calendar|channels|prospect|people)\/([^/?#&=]+)$/);if(!m)return null;
  let id='';try{id=decodeURIComponent(m[2]);}catch(e){return null;}
  return /^[A-Za-z0-9_.:-]{1,120}$/.test(id)?{view:m[1],id}:null;
}
let pendingDeepLink=parseDeepLink(INITIAL_HASH);
function goDeepLink(d){
  if(!d)return false;
  if(!authUser){pendingDeepLink=d;return false;}
  pendingDeepLink=null;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){} // so the same link can open it again
  closeModal();closeCmdk();
  if(d.view==='client')openClient(d.id);
  else if(d.view==='people')openClientPeople(d.id);   // #people/{clientId}: who of theirs can sign in
  else if(d.view==='prospect')openProspect(d.id);
  else if(d.view==='enquiry'||d.view==='inquiry')openEnquiry(d.id);
  else if(d.view==='enquiries'||d.view==='inquiries')render('calendar');
  else if(d.view==='meeting')openMeeting(d.id);
  else if(d.view==='channels'){if(typeof chv!=='undefined')chv.want=d.id||null;render('channels');}
  else{if(d.view==='calendar'&&d.id&&typeof mt!=='undefined')mt.want='meeting:'+d.id;render(views[d.view]?d.view:'home');}   // #calendar/{meetingId}: that call's week, with its panel open
  return true;
}
if(typeof window.addEventListener==='function')window.addEventListener('hashchange',()=>{const d=parseDeepLink(location.hash);if(d)goDeepLink(d);});

/* ---- Navigation: the places, most used first. The same list fills the sidebar on a computer and the tab bar on a
   phone. A phone has room for five, so it shows the first four and "More", which opens the rest as a sheet.
   Badges: red = that many need you, amber = that many are waiting. Website bookings are on the Calendar. ---- */
function navItems(){

  const say=(c,one,many)=>c?c+' '+(String(c)==='1'?one:many):'';
  const needs=n('dgNavCount'),cal=n('mtNavCount'),dr=n('drCount'),ch=n('chvNavCount'),emp=n('empCount'),late=n('jyLateCount'),money=n('moNavCount');
  return [
    {view:'home',icon:I.activity,label:'Today',badge:needs,tone:'red',badgeTitle:say(needs,'thing needs you','things need you'),also:['friday','requests','work','team']},
    {view:'calendar',icon:I.calendar,label:'Calendar',badge:cal,tone:'amber',badgeTitle:say(cal,'call needs an outcome','calls need an outcome'),also:['meeting','noShows','funnel']},
    {view:'drafts',icon:I.inbox,label:'Replies',badge:dr,tone:'red',badgeTitle:say(dr,'reply the bot drafted is waiting for you','replies the bot drafted are waiting for you')},
    {view:'clients',icon:I.clients,label:'Clients',badge:'',also:['client','needsYou','clientPeople','onboarding','onboardingClient']},
    {view:'channels',icon:I.chat,label:'Channels',badge:ch,tone:'red',badgeTitle:ch?ch+' unread':''},
    {view:'prospects',icon:I.inquiry,label:'Prospects',badge:'',also:['prospect']},
    {view:'employees',icon:I.people,label:'Employees',badge:emp,tone:'red',badgeTitle:say(emp,'unread message from your staff','unread messages from your staff')},
    {view:'journey',icon:I.steps,label:'Onboarding',badge:late,tone:'amber',badgeTitle:say(late,'step is running late','steps are running late')},
    {view:'money',icon:I.money,label:'Money',badge:money,tone:'red',badgeTitle:say(money,'payment or refund needs you','payments and refunds need you'),also:['billing','monthEnd','ending','dataDeletion']},
    {view:'documents',icon:I.doc,label:'Documents',badge:''},
    {view:'settings',icon:I.gear,label:'Settings',badge:''},
  ].filter(it=>hubAllowed(it.view));
}
const TAB_PLACES=4;   // places in the phone's tab bar, before "More"
function navOn(it){return it.view===currentView||(it.also||[]).includes(currentView);}
function navBadge(it){return it.badge?`<span class="badge ${it.tone}" title="${esc(it.badgeTitle)}" aria-hidden="true">${esc(it.badge)}</span>`:'';}
/* "More" on the phone: lit when the open screen is behind it, and badged with how many of its places have something waiting. */
function navMore(rest){
  const waiting=rest.filter(it=>it.badge);
  return {label:'More',icon:I.more,go:'openMore()',on:rest.some(navOn),badge:waiting.length||'',tone:waiting.some(it=>it.tone==='red')?'red':'amber',
    badgeTitle:waiting.length?'something is waiting in '+waiting.map(it=>it.label).join(', '):''};
}
function renderNav(){
  const items=navItems().map(it=>Object.assign(it,{on:navOn(it)}));
  const attrs=it=>`type="button" onclick="${it.go||`render('${it.view}')`}" aria-label="${esc(it.label+(it.badge?' \u2014 '+it.badgeTitle:''))}"${it.on?' aria-current="page"':''}`;
  const side=document.getElementById('navArea'),tab=document.getElementById('tabBar');
  if(side)side.innerHTML=items.map(it=>`<button class="nav-item${it.on?' active':''}" ${attrs(it)}>${it.icon}<span>${esc(it.label)}</span>${navBadge(it)}</button>`).join('');
  if(tab)tab.innerHTML=items.slice(0,TAB_PLACES).concat(navMore(items.slice(TAB_PLACES))).map(it=>`<button class="tab${it.on?' active':''}" ${attrs(it)}><span class="tab-ic">${it.icon}${navBadge(it)}</span><span class="tab-t">${esc(it.label)}</span></button>`).join('');
}
/* The sheet behind "More": the rest of the places, then what a phone has no other way to reach (find, light or dark, sign out). */
function openMore(){
  const row=(go,icon,label,extra,on)=>`<button type="button" class="more-item${on?' active':''}" onclick="closeModal();${go}"${on?' aria-current="page"':''}>${icon}<span>${esc(label)}</span>${extra||''}</button>`;
  openModal(`<div class="modal-head"><div><h3>More</h3></div></div><div class="modal-body more-list">`
    +navItems().slice(TAB_PLACES).map(it=>row(`render('${it.view}')`,it.icon,it.label,navBadge(it),navOn(it))).join('')
    +'<div class="more-rule"></div>'
    +row('openCmdk()',I.search,'Find a client or a screen')
    +row('toggleTheme()',I.moon,'Switch light / dark')
    +row('logout()',I.logout,'Sign out')
    +'</div>');
}
/* Phone alerts are gone (alerts show only in the hub). A phone that turned them on earlier: forget its old helper once. */
function tkDropOldPhoneAlerts(){
  if(typeof navigator==='undefined'||!navigator.serviceWorker||!navigator.serviceWorker.getRegistrations)return;
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{
    try{if(r.pushManager&&r.pushManager.getSubscription)r.pushManager.getSubscription().then(s=>s&&s.unsubscribe()).catch(()=>{});}catch(e){}
    try{r.unregister();}catch(e){}
  })).catch(()=>{});
}

/* ---- Auth (Supabase): only an approved profile with role 'admin' gets in ---- */
async function getProfile(uid){const {data}=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();return data;}
async function doLogin(){
  const email=val('loginEmail').toLowerCase(),pass=document.getElementById('loginPass').value;
  errEl('loginErr','');
  if(!email||!pass)return errEl('loginErr','Enter your email and password.');
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)return errEl('loginErr','Incorrect email or password.');
  await routeUser('loginErr');
}
/* A team member makes their own account; it waits (approved = false) until the owner approves it on the Team screen (⌘K, Team). */
function openSignUp(){const b=document.getElementById('signUpBox');if(b){b.style.display='block';const n=document.getElementById('suName');if(n&&n.focus)n.focus();}}
async function doSignUp(){
  const name=val('suName'),email=val('suEmail').toLowerCase(),pass=(document.getElementById('suPass')||{}).value||'';
  errEl('suErr','');const ok=document.getElementById('suOk');if(ok)ok.style.display='none';
  if(!name||!/.+@.+\..+/.test(email))return errEl('suErr','Write your name and a working email address.');
  if(pass.length<8)return errEl('suErr','Use a password of at least 8 characters.');
  const {error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});
  if(error)return errEl('suErr',error.message||'That did not go through. Try again.');
  try{await sb.auth.signOut();}catch(e){}
  if(ok){ok.textContent='Account made. The owner has to approve it — then sign in above with this email and password.';ok.style.display='block';}
}
async function routeUser(errId){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){showLogin();return;}
  let prof=await getProfile(user.id);
  if(!prof){await new Promise(r=>setTimeout(r,800));prof=await getProfile(user.id);}
  // the owner (role admin) or an approved team member (role employee: sees everything, changes nothing)
  const isTeam=!!(prof&&prof.approved&&(prof.role==='admin'||prof.role==='employee'));
  if(!isTeam){
    // Not the team. They may be a client: portal_home() answers only for a portal client. A client never
    // enters this shell — they are sent to their own page, still signed in.
    authUser=null;
    // Appointed to a client's prospects? The grant itself is the seat: one screen, nothing else.
    let seat=false;
    try{const r=await sb.rpc('prospect_seat');seat=!!(r&&!r.error&&r.data);}catch(e){seat=false;}
    if(seat&&prof){
      authUser={uid:prof.id,name:prof.name||'Team member',role:'prospect',email:prof.email||user.email||''};
      try{document.body.classList.add('ro');}catch(e){}
      document.getElementById('loginPass').value='';
      enterApp();return;
    }
    let home=null;
    try{const r=await sb.rpc('portal_home');home=r&&!r.error?r.data:null;}catch(e){home=null;}
    if(home){showLogin();try{location.replace('/portal.html');}catch(e){}return;}
    try{await sb.auth.signOut();}catch(e){}
    showLogin();
    return errEl(errId,prof&&!prof.approved?'Your account is waiting for the owner to approve it. Try again once they have.':'Aviance OS is for the Aviance team.');
  }
  authUser={uid:prof.id,name:prof.name||(prof.role==='admin'?'Owner':'Team member'),role:prof.role==='admin'?'admin':'employee',email:prof.email||user.email||''};
  try{document.body.classList.toggle('ro',authUser.role!=='admin');}catch(e){}
  document.getElementById('loginPass').value='';
  enterApp();
}
/* The boot screen leaves upward and uncovers what is behind it, the way the
   website's splash does, rather than blinking out. If the machine is set to
   less movement the rule in motion.css hides it outright, so this still ends
   with the screen gone either way. */
let bootGoing=false;
function hideBoot(){
  const b=document.getElementById('bootScreen');
  if(!b||bootGoing)return;
  bootGoing=true;
  if(b.classList&&b.classList.add)b.classList.add('mo-handoff');
  const done=()=>{b.style.display='none';};
  if(b.addEventListener)b.addEventListener('animationend',done,{once:true});
  setTimeout(done,700);   /* belt and braces: no animation, no event */
}
function enterApp(){
  hideBoot();
  document.getElementById('login').style.display='none';document.getElementById('app').style.display='grid';
  document.getElementById('whoAvatar').textContent=(authUser.name||'A').trim().charAt(0).toUpperCase()||'A';
  document.getElementById('whoName').textContent=authUser.name;
  document.getElementById('whoEmail').textContent=authUser.email;
  if(!(pendingDeepLink&&goDeepLink(pendingDeepLink)))render(hubProspectSeat()?'prospects':'home');
  try{tkDropOldPhoneAlerts();}catch(e){}
}
function showLogin(){
  hideBoot();
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  closeModal();closeCmdk();
  try{if(typeof mtStopTimer==='function')mtStopTimer();}catch(e){}

}

function openResetPassword(){
  openModal(`<div class="modal-head"><div class="pj-ic" style="background:#0000000f;color:#000000;width:40px;height:40px">${I.check}</div><div><h3>Set a new password</h3><p>You followed a recovery link — choose a new password for your account.</p></div></div>
    <div class="modal-body">

async function submitNewPassword(){

  errEl('npwErr','');

/* ---- An old invite link (https://aviance.store/#join={token}): the join page lives in join.html now, so hand the token straight on. ---- */
function parseJoinToken(h){const m=/[#&]join=([A-Za-z0-9_-]{16,200})(?:&|$)/.exec(String(h||''));return m?m[1]:'';}
const oldJoinToken=parseJoinToken(INITIAL_HASH);
try{sessionStorage.removeItem('avianceJoin');}catch(e){}
/* The screens' files load after this script: wait for the page to finish loading before the first screen is drawn,
   so a quick answer about the saved session can never arrive before the screen it needs. */
function pageReady(){return new Promise(r=>{if(document.readyState!=='loading')return r();document.addEventListener('DOMContentLoaded',()=>r(),{once:true});});}
async function boot(){
  if(hubStandalone()){const n=document.getElementById('loginAppNote');if(n)n.style.display='block';}
  if(oldJoinToken){showLogin();try{location.replace('/join.html#'+oldJoinToken);}catch(e){}return;}   // an old-style invite link: join.html does the rest
  try{const {data:{session}}=await sb.auth.getSession();await pageReady();if(session)await routeUser('loginErr');}catch(e){}
  if(!authUser)showLogin();
  if(authUser&&INITIAL_HASH.indexOf('type=recovery')>-1){
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    setTimeout(openResetPassword,400);
  }
}

/* ---- ⌘K: every client by name, person or email; every screen by name; and two commands ---- */
let cmdkState={items:[],sel:0};
function cmdkActions(){return [
  {type:'Command',label:'Switch light / dark',icon:I.moon,sub:'How Aviance OS looks',kw:'theme dark light mode toggle',run:()=>{closeCmdk();toggleTheme();}},
  {type:'Command',label:'Sign out',icon:I.logout,sub:'End your session',kw:'log out sign out logout',run:()=>{closeCmdk();logout();}},
];}
/* [view, what it is called, other words people type]. The sidebar's places first, then the pages inside them. */
const CMDK_SCREENS=[['home','Today','dashboard home'],['calendar','Calendar','calls bookings meetings'],['drafts','Replies','drafts bot approve inbox'],['clients','Clients','book list'],['prospects','Prospects','leads prospect window emails replies sequence'],
  ['channels','Channels','messages chat'],['employees','Employees','staff people chat'],['journey','Onboarding','new clients steps launch'],
  ['billing','Invoices','billing money paid'],['documents','Documents','agreement welcome invoice'],['settings','Settings','preferences'],
  ['needsYou','Needs you','behind attention'],['funnel','Funnel','enquiries wins'],['noShows','No-shows','missed calls'],['requests','Requests','client asks questions'],
  ['friday','Friday update','weekly note'],['monthEnd','Month end','close months'],['ending','Ending','wrap up leaving cancel'],['dataDeletion','Data deletion','remove erase privacy'],
  ['team','Team','accounts approve sign up access'],['work','Work','tasks jobs queue'],
  /* 'Their people' is the ONLY place in the browser that can make a portal
     invite (portal_invite_create, portal.js). It had a route in `views` and a
     function to open it and nothing anywhere called that function: it was not
     in this list, not in parseDeepLink, and no screen linked to it. So the
     welcome email made a client's first login and there was no way to give
     them a second one without the SQL editor — which on a Growth plan (4
     logins) or a Scale plan (unlimited) is the plan not working. Checked
     2026-11-27: openClientPeople had no callers at all. */
  ['clientPeople','Their people','invite portal login logins seats access give them a login']];
/* Screens that are about ONE client and are meaningless without one. Offered in
   the palette only while a client is open, because 'Their people' with nobody
   chosen can only answer "you don't have access to do that", which reads as a
   fault rather than as "pick a client first". */
const CMDK_NEEDS_CLIENT=['clientPeople'];
function cmdkEntities(){
  const out=[],seen={};
  const list=(typeof cb!=='undefined'&&cb&&Array.isArray(cb.clients)&&cb.clients.length)?cb.clients:hubClients;
  (list||[]).forEach(c=>{if(!c||!c.id||seen[c.id])return;seen[c.id]=1;
    out.push({type:'Clients',label:String(c.company||c.contact_name||'Client'),sub:[c.contact_name,c.stage].filter(Boolean).join(' · '),icon:I.people,
      kw:[c.company,c.contact_name,c.contact_email,'client'].filter(Boolean).join(' '),run:()=>{closeCmdk();openClient(c.id);}});});
  CMDK_SCREENS.forEach(([v,label,kw])=>{if(!views[v]||!hubAllowed(v))return;
    if(CMDK_NEEDS_CLIENT.includes(v)&&!currentClientId)return;
    out.push({type:'Screens',label,sub:views[v].sub||'',icon:I.pulse,kw:label+' '+kw+' '+v,run:()=>{closeCmdk();render(v);}});});
  return out;
}
function openCmdk(){if(!authUser)return;const w=document.getElementById('cmdkWrap');if(!w.classList.contains('open'))keepFocus();w.classList.add('open');const inp=document.getElementById('cmdkInput');inp.value='';
  try{inp.focus();}catch(e){}   // straight away, so the first keys typed are not lost
  renderCmdk('');setTimeout(()=>{if(document.activeElement!==inp)inp.focus();},30);
  if(!hubClients.length)hubLoadClients().then(()=>{if(w.classList.contains('open'))renderCmdk(inp.value);}).catch(()=>{});}
function closeCmdk(){const w=document.getElementById('cmdkWrap');if(!w.classList.contains('open'))return false;w.classList.remove('open');giveFocusBack();return true;}
function renderCmdk(q){q=(q||'').toLowerCase().trim();
  let items=[...cmdkEntities(),...cmdkActions()];
  if(q)items=items.filter(it=>(it.kw||it.label).toLowerCase().includes(q));
  items=items.slice(0,50);cmdkState.items=items;cmdkState.sel=0;
  const list=document.getElementById('cmdkList');
  const inp=document.getElementById('cmdkInput');
  if(!items.length){list.innerHTML=`<div class="cmdk-empty">No matches for "${esc(q)}"</div>`;attr(inp,'aria-activedescendant',null);return;}
  let html='',lastType=null;
  items.forEach((it,i)=>{if(it.type!==lastType){html+=`<div class="cmdk-group">${esc(it.type)}</div>`;lastType=it.type;}
    html+=`<div class="cmdk-item ${i===0?'sel':''}" id="cmdkOpt${i}" role="option" aria-selected="${i===0?'true':'false'}" data-i="${i}" onclick="cmdkRun(${i})" onmousemove="cmdkSel(${i})"><div class="ci-ic" aria-hidden="true">${it.icon||I.pulse}</div><div style="min-width:0"><b>${esc(it.label)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</div></div>`;});
  list.innerHTML=html;
  attr(inp,'aria-activedescendant','cmdkOpt0');}
function cmdkSel(i){cmdkState.sel=i;document.querySelectorAll('#cmdkList .cmdk-item').forEach((el,j)=>{const on=j===i;el.classList.toggle('sel',on);attr(el,'aria-selected',on?'true':'false');});
  attr(document.getElementById('cmdkInput'),'aria-activedescendant','cmdkOpt'+i);}
function cmdkRun(i){const it=cmdkState.items[i];if(it&&it.run)it.run();}
function cmdkMove(d){if(!cmdkState.items.length)return;cmdkState.sel=(cmdkState.sel+d+cmdkState.items.length)%cmdkState.items.length;document.querySelectorAll('#cmdkList .cmdk-item').forEach((el,j)=>{const on=j===cmdkState.sel;el.classList.toggle('sel',on);attr(el,'aria-selected',on?'true':'false');if(on&&typeof el.scrollIntoView==='function')el.scrollIntoView({block:'nearest'});});
  attr(document.getElementById('cmdkInput'),'aria-activedescendant','cmdkOpt'+cmdkState.sel);}
document.getElementById('cmdkInput').addEventListener('input',e=>renderCmdk(e.target.value));
document.getElementById('cmdkInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();cmdkMove(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdkMove(-1);}
  else if(e.key==='Enter'){e.preventDefault();cmdkRun(cmdkState.sel);}
  else if(e.key==='Escape'){closeCmdk();}
  else if(e.key==='Tab'){trapTab(document.querySelector('.cmdk'),e);}
});

/* ---- Notifications (the bell): what the calendar says needs you ---- */
function computeNotifs(){if(!authUser)return [];try{return typeof mtNotifs==='function'?mtNotifs():[];}catch(e){return [];}}
let notifSaid=null;
function updateNotifBadge(){const dot=document.getElementById('notifDot');if(!dot)return;const n=computeNotifs();
  if(n.length){dot.style.display='grid';dot.textContent=n.length>9?'9+':n.length;}else{dot.style.display='none';}
  const name=n.length?('What needs you — '+n.length+(n.length===1?' thing':' things')):'What needs you — nothing right now';
  attr(document.getElementById('notifBtn'),'aria-label',name);
  if(notifSaid!==null&&notifSaid!==n.length&&n.length>notifSaid)announce(name);
  notifSaid=n.length;}
function toggleNotif(e){e.stopPropagation();const pop=document.getElementById('notifPop'),btn=document.getElementById('notifBtn');
  if(pop.classList.contains('open')){closeNotif();return;}
  keepFocus();
  const n=computeNotifs();window._notifs=n;
  pop.innerHTML=`<h3 class="notif-head" id="notifTitle">What needs you</h3>`+(n.length?`<div class="notif-list">${n.map((x,i)=>`<button type="button" class="notif-item" onclick="runNotif(${i})"><span class="nd" style="background:${x.dot}" aria-hidden="true"></span><div style="min-width:0"><b>${esc(x.t)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</div></button>`).join('')}</div>`:`<div class="notif-empty">Nothing needs you right now.</div>`);
  attr(pop,'aria-labelledby','notifTitle');
  pop.classList.add('open');
  attr(btn,'aria-expanded','true');
  const f=focusables(pop)[0];if(f)f.focus();else{attr(pop,'tabindex','-1');if(typeof pop.focus==='function')pop.focus();}}
function runNotif(i){const x=(window._notifs||[])[i];const pop=document.getElementById('notifPop');pop.classList.remove('open');attr(document.getElementById('notifBtn'),'aria-expanded','false');lastFocus=null;if(x&&x.go)x.go();}
document.addEventListener('click',e=>{const p=document.getElementById('notifPop');if(p&&p.classList.contains('open')&&!e.target.closest('#notifPop')&&!e.target.closest('#notifBtn')){p.classList.remove('open');attr(document.getElementById('notifBtn'),'aria-expanded','false');lastFocus=null;}});

/* ---- Theme + shortcuts ---- */
function themeColorMeta(){const d=document.body.classList.contains('dark');const m=document.getElementById('themeColor');if(m&&typeof m.setAttribute==='function')m.setAttribute('content',d?'#0B111B':'#F6F7F9');try{document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}}
function toggleTheme(){setTheme(document.body.classList.contains('dark')?'light':'dark');}
/* ⌘K and the phone's More sheet switch it. Remembered on this device. */
function setTheme(mode){const d=mode==='dark';document.body.classList.toggle('dark',d);try{localStorage.setItem('avianceTheme',d?'dark':'light');}catch(e){}themeColorMeta();}
function initTheme(){try{if(localStorage.getItem('avianceTheme')==='dark')document.body.classList.add('dark');}catch(e){}themeColorMeta();}
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))||e.target.isContentEditable;
  if(e.key==='Tab'){
    const mw=document.getElementById('modalWrap'),np=document.getElementById('notifPop');
    if(mw&&mw.classList.contains('open')&&trapTab(document.getElementById('modal'),e))return;
    if(np&&np.classList.contains('open')&&np.contains(e.target)&&trapTab(np,e))return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!authUser)return;const w=document.getElementById('cmdkWrap');w.classList.contains('open')?closeCmdk():openCmdk();return;}
  if(e.key==='Escape'){if(closeCmdk())return;if(closeNotif())return;closeModal();return;}
  if(typing||!authUser)return;
  if(e.key==='/'){e.preventDefault();openCmdk();}
});
initTheme();
boot();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>Aviance — your channel</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="portal-client.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="core.js"></script>
<script src="portal-client.js"></script>
<script src="portal-tracker.js"></script>
<script src="portal-schedule.js"></script>
<script src="portal-steps.js"></script>
</head>
<body>
<!-- The client's whole world: sign in, then one channel with the Aviance team.
     What a client may read or write is decided by the database (row level
     security), not by this page. Loads only portal-client.js. -->
<noscript><main class="pc-wrap pc-notice"><h1 class="pc-h1">Please turn on JavaScript.</h1><p class="pc-lede">This page needs it to open your channel.</p></main></noscript>
<div id="pcRoot"></div>
<script>
(function(){
  const root = document.getElementById('pcRoot');
  let home = null, rows = [], drawn = '', stopLive = null, timer = null, loading = false, sendBusy = false;

  /* The three tabs. Chat is what has always been here; Campaign and Calls are
     drawn by portal-tracker.js into #pcCampaign and #pcCalls. PC.tab tells it
     which one the client is looking at, so a tab nobody has opened is never
     asked for. */
  const TABS = [{ key: 'chat', label: 'Chat' }, { key: 'campaign', label: 'Campaign' }, { key: 'calls', label: 'Calls' }];
  let tab = 'chat';
  PC.tab = tab;

  /* ---- signing in ---- */
  function showSignIn(message, email){
    stopChat();
    document.title = 'Aviance — sign in';
    root.innerHTML = `<main class="pc-wrap pc-notice">${pcLogoHtml()}
      <h1 class="pc-h1" tabindex="-1">Sign in.</h1>
      <p class="pc-lede">Your direct line to the Aviance team.</p>
      <form class="pc-form" id="pcInForm" novalidate>
        <div class="pc-field"><label class="pc-label" for="pcInEmail">Email</label>
          <input class="pc-input" id="pcInEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required value="${pcEsc(email || '')}"></div>
        <div class="pc-field"><label class="pc-label" for="pcInPw">Password</label>
          <input class="pc-input" id="pcInPw" type="password" autocomplete="current-password" required aria-describedby="pcInErr"></div>
        <p class="pc-err" id="pcInErr" role="alert" aria-live="assertive">${pcEsc(message || '')}</p>
        <button type="submit" class="pc-btn" id="pcInBtn">Sign in</button>
        <p class="pc-small pc-under">Forgotten your password? Reply to any email from us and we will send you a new link.</p>
      </form>
    </main>`;
  }

  async function signIn(form){
    const email = form.querySelector('#pcInEmail').value.trim();
    const pw = form.querySelector('#pcInPw').value;
    const err = form.querySelector('#pcInErr'), btn = form.querySelector('#pcInBtn');
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
    /* A limit on both asks. Signing in twice is harmless, so past the limit it
       reads as no connection and the button comes back; it used to say
       "Signing in…" until the tab was closed. */
    const r = await pcRead(function(){ return pcSignIn(email, pw); }, 20000);
    if (!r.ok) { btn.disabled = false; btn.textContent = 'Sign in'; err.textContent = r.error; return; }
    enter(email);
  }

  async function enter(email){
    const r = await pcRead(pcHome);
    if (!r.ok) {
      if (r.offline) { root.innerHTML = pcOfflineHtml(); return; }
      await pcSignOut();
      showSignIn('We could not open your channel. Please sign in again.', email);
      return;
    }
    if (!r.data) {
      await pcSignOut();
      showSignIn('This login is not a client account.', email);
      return;
    }
    home = r.data;
    showChat();
  }

  /* ---- the channel ---- */
  function showChat(){
    document.title = (home.company || 'Your channel') + ' — Aviance';
    root.innerHTML = `<div class="pc-app">
      <header class="pc-bar"><div class="pc-bar-in">${pcLogoHtml()}
        <div class="pc-bar-t"><h1>${pcEsc(home.company || 'Your channel')}</h1><p class="pc-tag">Direct line to Aviance</p></div>
        <button type="button" class="pc-btn pc-btn-quiet" id="pcOut">Sign out</button>
      </div></header>
      <div id="pcStanding" class="pc-standing"></div>
      <nav class="pc-tabs"><div class="pc-tabs-in" role="tablist" aria-label="Your portal">
        ${TABS.map(function(t){ return `<button type="button" role="tab" class="pc-tab" id="pcTab-${t.key}" data-pc-tab="${t.key}" aria-controls="pcPanel-${t.key}" aria-selected="${t.key === tab ? 'true' : 'false'}" tabindex="${t.key === tab ? '0' : '-1'}">${pcEsc(t.label)}</button>`; }).join('')}
      </div></nav>
      <div class="pc-panels">
        <section class="pc-panel" id="pcPanel-chat" role="tabpanel" aria-labelledby="pcTab-chat"${tab === 'chat' ? '' : ' hidden'}>
          <div id="pcTracker" class="pc-tracker-box"></div>
          <div class="pc-scroll" id="pcScroll" tabindex="0" aria-label="Messages">
            <div class="pc-thread" id="pcThread" role="log" aria-live="polite" aria-relevant="additions"><p class="pc-tag" style="margin:auto">Loading</p></div>
          </div>
          <form class="pc-compose" id="pcCompose"><div class="pc-compose-in">
            <p class="pc-err" id="pcSendErr" role="alert" aria-live="assertive"></p>
            <div class="pc-compose-row">
              <label class="pc-sr" for="pcText">Message the Aviance team</label>
              <textarea id="pcText" rows="1" maxlength="${PC_MAX_BODY}" placeholder="Write a message" enterkeyhint="send" aria-describedby="pcCount"></textarea>
              <button type="submit" class="pc-btn" id="pcSendBtn">Send</button>
            </div>
            <p class="pc-tag pc-count" id="pcCount" aria-live="polite"></p>
          </div></form>
        </section>
        <section class="pc-panel" id="pcPanel-campaign" role="tabpanel" aria-labelledby="pcTab-campaign" tabindex="0"${tab === 'campaign' ? '' : ' hidden'}>
          <div class="pc-sheet"><div class="pc-sheet-in" id="pcCampaign"></div></div>
        </section>
        <section class="pc-panel" id="pcPanel-calls" role="tabpanel" aria-labelledby="pcTab-calls" tabindex="0"${tab === 'calls' ? '' : ' hidden'}>
          <div class="pc-sheet"><div class="pc-sheet-in" id="pcCalls"></div></div>
        </section>
      </div>
    </div>`;
    drawn = ''; rows = [];
    /* the kickoff is offered in the chat, by portal-schedule.js */
    runMounts();
    refresh(true);
    stopLive = pcSubscribe(home.channel.id, function(){ refresh(false); });
    timer = setInterval(function(){ if (!document.hidden) refresh(false); }, PC_POLL_MS);
  }

  /* Show one tab. The other panels stay in the page, hidden, so the chat keeps
     its live connection, its scroll and anything half-typed. */
  function showTab(key, focus){
    if (!TABS.some(function(t){ return t.key === key; })) return;
    tab = key;
    PC.tab = key;
    TABS.forEach(function(t){
      const btn = document.getElementById('pcTab-' + t.key), panel = document.getElementById('pcPanel-' + t.key);
      const on = t.key === key;
      if (btn) { btn.setAttribute('aria-selected', on ? 'true' : 'false'); btn.tabIndex = on ? 0 : -1; if (on && focus) btn.focus(); }
      if (panel) { if (on) panel.removeAttribute('hidden'); else panel.setAttribute('hidden', ''); }
    });
    if (key === 'chat') { const box = document.getElementById('pcScroll'); if (box) box.scrollTop = box.scrollHeight; }
    runMounts();
  }

  function stopChat(){
    tab = 'chat';
    PC.tab = 'chat';
    if (stopLive) { stopLive(); stopLive = null; }
    if (timer) { clearInterval(timer); timer = null; }
    home = null; rows = []; drawn = '';
  }

  function draw(toBottom){
    const box = document.getElementById('pcScroll'), thread = document.getElementById('pcThread');
    if (!box || !thread || !home) return;
    const days = pcGroupMessages(rows, home, new Date());
    const html = pcThreadHtml(days);
    if (html === drawn && !toBottom) return;
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    /* whoever is typing in a card keeps their cursor through the redraw */
    if (html !== drawn) { pcKeepFocus(thread, function(){ thread.innerHTML = html; }); drawn = html; }
    if (toBottom || near) box.scrollTop = box.scrollHeight;
  }

  async function refresh(toBottom){
    if (!home || loading) return;
    loading = true;
    const id = home.channel.id;
    let r;
    /* `loading` is cleared whatever happens: left true, the chat would never ask
       again and the client would watch a thread that silently stopped arriving.
       pcRead puts a limit on it too: a read that never answers used to leave the
       thread on "Loading" for ever. It is a read, so giving up on it is safe, and
       the poll below asks again in twenty seconds. */
    try { r = await pcRead(function(){ return pcMessages(id); }); }
    catch (e) { r = pcErr(e); }
    finally { loading = false; }
    if (!home || home.channel.id !== id) return;
    if (r.ok) { rows = r.data; draw(toBottom); runMounts(); }
    else if (!drawn) {
      const thread = document.getElementById('pcThread');
      if (thread) thread.innerHTML = `<p class="pc-small" style="margin:auto;text-align:center">${pcEsc(r.error)}</p>`;
    }
  }

  /* the journey files hook in here (see PC in portal-client.js) */
  function ctx(){ return { home: home, sb: pcClient('portal'), refresh: function(){ refresh(true); }, rpc: function(n, a){ return pcRpc('portal', n, a); } }; }
  function runMounts(){ if (!home) return; (PC.mounts || []).forEach(function(fn){ try { fn(ctx()); } catch (e) {} }); }

  function grow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 4, 180) + 'px'; }
  function count(el){
    const c = document.getElementById('pcCount');
    if (c) c.textContent = el.value.length >= PC_MAX_BODY - 400 ? el.value.length + ' / ' + PC_MAX_BODY : '';
  }

  async function send(){
    if (sendBusy || !home) return;
    const el = document.getElementById('pcText'), err = document.getElementById('pcSendErr'), btn = document.getElementById('pcSendBtn');
    const raw = el.value;
    const text = pcCleanBody(raw);
    if (!text) { el.focus(); return; }
    sendBusy = true; btn.disabled = true; err.textContent = '';
    let r;
    /* Never retried — it may already have been written, and a client seeing their
       own message twice is worse than seeing it once. But the button is always
       given back, or they could never write to us again without reloading. */
    const channel = home.channel.id, person = home.person.id;
    try { r = await pcWrite(function(){ return pcSend(channel, person, text); }); }
    catch (e) { r = pcErr(e); }
    finally { sendBusy = false; btn.disabled = false; }
    if (!r.ok && r.noAnswer) {
      /* It may have gone. What was typed stays in the box, and the thread is read
         again so they can see for themselves before sending it a second time. */
      err.textContent = 'We did not hear back from Aviance, so we cannot tell whether that message went. Look for it in the thread above before you send it again.';
      el.focus(); refresh(false); return;
    }
    if (!r.ok) { err.textContent = 'That message did not go. ' + r.error; el.focus(); return; }
    /* keep whatever was typed while the message was on its way */
    el.value = el.value === raw ? '' : (el.value.indexOf(raw) === 0 ? el.value.slice(raw.length).replace(/^\s+/, '') : el.value);
    grow(el); count(el); el.focus();
    if (r.data && r.data.id != null && !rows.some(function(m){ return m.id === r.data.id; })) rows = rows.concat([r.data]);
    draw(true);
    refresh(true);
  }

  root.addEventListener('submit', function(e){
    if (!e.target) return;
    if (e.target.id === 'pcInForm') { e.preventDefault(); signIn(e.target); }
    if (e.target.id === 'pcCompose') { e.preventDefault(); send(); }
  });
  root.addEventListener('click', async function(e){
    const tb = e.target && e.target.closest ? e.target.closest('[data-pc-tab]') : null;
    if (tb) { showTab(tb.getAttribute('data-pc-tab')); return; }
    const act = e.target && e.target.closest ? e.target.closest('[data-pc-act]') : null;
    if (act && home) { const f = PC.actions && PC.actions[act.getAttribute('data-pc-act')]; if (typeof f === 'function') { e.preventDefault(); try { await f(act, ctx()); } catch (x) {} } return; }
    const t = e.target && e.target.closest ? e.target.closest('#pcOut,[data-pc-retry]') : null;
    if (!t) return;
    if (t.id === 'pcOut') { stopChat(); await pcSignOut(); showSignIn(''); const h = root.querySelector('h1'); if (h) h.focus(); }
    else boot();
  });
  root.addEventListener('keydown', function(e){
    if (e.target && e.target.id === 'pcText' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
    /* the tab strip answers to the arrow keys, as a tablist should */
    const tb = e.target && e.target.closest ? e.target.closest('[data-pc-tab]') : null;
    if (!tb) return;
    const i = TABS.findIndex(function(t){ return t.key === tb.getAttribute('data-pc-tab'); });
    if (i < 0) return;
    let to = -1;
    if (e.key === 'ArrowRight') to = (i + 1) % TABS.length;
    else if (e.key === 'ArrowLeft') to = (i - 1 + TABS.length) % TABS.length;
    else if (e.key === 'Home') to = 0;
    else if (e.key === 'End') to = TABS.length - 1;
    if (to < 0) return;
    e.preventDefault();
    showTab(TABS[to].key, true);
  });
  root.addEventListener('input', function(e){
    if (e.target && e.target.id === 'pcText') { grow(e.target); count(e.target); }
  });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(false); });
  window.addEventListener('online', function(){ refresh(false); });

  async function boot(){
    root.innerHTML = pcLoadingHtml();
    const s = await pcRead(pcSession);
    if (!s.ok) { root.innerHTML = pcOfflineHtml(); return; }
    if (s.data) enter(s.data.user && s.data.user.email); else showSignIn('');
  }
  pcOnSignedOut(function(){ if (home) showSignIn('You have been signed out. Sign in again to carry on.'); });
  boot();
})();
</script>
</body>
</html>
